{# One line-icon set: 24px grid, 2px rounded strokes. icon(name) draws one; unknown names draw nothing. #}
{% macro icon(name, cls='') -%}
<svg viewBox="0 0 24 24" aria-hidden="true" class="ico {{ cls }}">
  {%- if name == 'home' %}<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>
  {%- elif name == 'plan' %}<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>
  {%- elif name == 'pantry' %}<rect x="6" y="3" width="12" height="18" rx="3"/><path d="M6 10h12M9 6v2M9 13v3"/>
  {%- elif name == 'recipes' %}<path d="M6 4h10a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"/><path d="M6 18a2 2 0 0 1 2-2h10M10 8h4"/>
  {%- elif name == 'more' %}<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>
  {%- elif name == 'settings' %}<path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.4 7.4 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 2.6-1.5l2.4 1 2-3.4z"/>
  {%- elif name == 'cart' %}<path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>
  {%- elif name == 'clock' %}<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>
  {%- elif name == 'leaf' %}<path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19 13 11"/>
  {%- elif name == 'spark' %}<path d="M12 3c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7z"/><path d="M19 3v3M17.5 4.5h3"/>
  {%- elif name == 'bowl' %}<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1 1-1 1-2M13 7c0-1 1-1 1-2"/>
  {%- elif name == 'star' %}<path d="m12 4 2.4 5 5.6.6-4.2 3.8 1.2 5.6L12 16.2 7 19l1.2-5.6L4 9.6 9.6 9z"/>
  {%- elif name == 'sun' %}<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
  {%- elif name == 'moon' %}<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
  {# about you #}
  {%- elif name == 'male' %}<circle cx="10" cy="14" r="6"/><path d="M14.5 9.5 20 4M15 4h5v5"/>
  {%- elif name == 'female' %}<circle cx="12" cy="9" r="6"/><path d="M12 15v7M9 19h6"/>
  {%- elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
  {%- elif name == 'scale' %}<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 9a5 5 0 0 1 8 0l-3 3"/>
  {%- elif name == 'snail' %}<path d="M3 18h13a5 5 0 1 0-5-5c0 1.7 1.3 3 3 3a2 2 0 1 0-2-2"/><path d="M16 18a3 3 0 0 0 3-3V8M19 8l-1.5-2.5M19 8l1.5-2.5"/>
  {%- elif name == 'walk' %}<circle cx="13" cy="4.5" r="1.8"/><path d="m9 21 2.5-6.5L14 17v4M8 11l3-3.5 3 1 2 3.5M11 8l-.5 6.5"/>
  {%- elif name == 'run' %}<circle cx="15" cy="4.5" r="1.8"/><path d="m5 20 4-1 2-3.5 3 2.5v4M7 10.5l3.5-3 4 1.5 1.5 3.5 3 .5M10.5 7.5 11 15.5"/>
  {# days #}
  {%- elif name == 'desk' %}<rect x="5" y="4" width="14" height="10" rx="2"/><path d="M3 18h18M9 14v4M15 14v4"/>
  {%- elif name == 'standing' %}<circle cx="12" cy="4.5" r="2"/><path d="M12 7.5v7M8 10.5h8M12 14.5l-3 6.5M12 14.5l3 6.5"/>
  {%- elif name == 'hardhat' %}<path d="M3 17h18M5 17v-2a7 7 0 0 1 14 0v2"/><path d="M10 8V5.5h4V8"/>
  {%- elif name == 'feather' %}<path d="M20 4C11 4 6 9 6 18l-2 2"/><path d="M6 18c7 0 12-5 12-11M10 14h5"/>
  {%- elif name == 'dumbbell' %}<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>
  {%- elif name == 'flame' %}<path d="M12 21a6.5 6.5 0 0 0 6.5-6.5c0-4.5-4-6.5-4-11-3 2-5.5 5-5.5 8-1.5-.5-2-2-2-3.5C5 10 5.5 12 5.5 14.5A6.5 6.5 0 0 0 12 21z"/>
  {%- elif name == 'calendar' %}<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4M8 14h2M12 14h2M16 14h0M8 17h2"/>
  {%- elif name == 'shuffle' %}<path d="M3 7h3.5c4.5 0 6.5 10 11 10H21M3 17h3.5c1.8 0 3-1.6 4.2-3.6M13.3 9.6C14.5 8 15.8 7 17.5 7H21M18.5 4.5 21 7l-2.5 2.5M18.5 14.5 21 17l-2.5 2.5"/>
  {%- elif name == 'nocook' %}<path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M8 8h8M3 3l18 18"/>
  {%- elif name == 'bolt' %}<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>
  {%- elif name == 'chef' %}<path d="M7 14a4 4 0 0 1-1-7.9A5 5 0 0 1 12 3a5 5 0 0 1 6 3.1A4 4 0 0 1 17 14v6H7z"/><path d="M7 17h10"/>
  {%- elif name == 'school' %}<path d="M2 9 12 4l10 5-10 5z"/><path d="M6 11v5c2 2.5 10 2.5 12 0v-5M22 9v6"/>
  {# food #}
  {%- elif name == 'plate' %}<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/>
  {%- elif name == 'drumstick' %}<path d="M15.5 3.5a5 5 0 0 1 5 5c0 4-5 6.5-8.5 6.5L9 18a2 2 0 1 1-3 3 2 2 0 1 1-3-3 2 2 0 1 1 3-1l3-3c0-3.5 2.5-8.5 6.5-8.5z"/>
  {%- elif name == 'fish' %}<path d="M3 12c3-4.5 7-6 11-6 3 0 5.5 2 7 6-1.5 4-4 6-7 6-4 0-8-1.5-11-6z"/><path d="M3 12 1 9M3 12l-2 3"/><circle cx="16" cy="11" r=".8"/>
  {%- elif name == 'egg' %}<path d="M12 3c3.5 0 6.5 6 6.5 10.5A6.5 6.5 0 0 1 5.5 13.5C5.5 9 8.5 3 12 3z"/>
  {%- elif name == 'sprout' %}<path d="M12 21v-9M12 12C12 7 8.5 5 4 5c0 4.5 3 7 8 7zM12 12c0-3.5 3-6 8-6 0 4-3 6-8 6"/>
  {%- elif name == 'avocado' %}<path d="M12 3c-3 0-4.5 4-6 8a7 7 0 1 0 12 0c-1.5-4-3-8-6-8z"/><circle cx="12" cy="14.5" r="2.8"/>
  {%- elif name == 'chili' %}<path d="M18 6c-1 6-5 13-13 14 1-5 3-8 6.5-10.5C14 7.5 16 6 18 6z"/><path d="M18 6c0-2 1-3 2.5-3"/>
  {# kitchen #}
  {%- elif name == 'stove' %}<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="2"/><circle cx="15" cy="9" r="2"/><circle cx="9" cy="15" r="2"/><circle cx="15" cy="15" r="2"/>
  {%- elif name == 'microwave' %}<rect x="3" y="5" width="18" height="14" rx="3"/><rect x="6" y="8" width="9" height="8" rx="1.5"/><path d="M18 9v.01M18 12v.01M18 15v.01"/>
  {%- elif name == 'ricecooker' %}<path d="M4 11h16v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M5 11a7 4 0 0 1 14 0M12 7V5M9 15h6"/>
  {%- elif name == 'toaster' %}<path d="M4 20V12a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v8z"/><path d="M9 9v4M15 9v4M4 16h16"/>
  {%- elif name == 'oven' %}<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 8h16M8 5.5h.01M12 5.5h.01"/><rect x="7" y="11" width="10" height="7" rx="1.5"/>
  {%- elif name == 'airfryer' %}<path d="M6 21h12l1-12a7 7 0 0 0-14 0z"/><path d="M8 13h8M12 6v2"/>
  {%- elif name == 'blender' %}<path d="M7 3h10l-2 11H9zM8 14h8l1 7H7z"/><path d="M12 17.5h.01"/>
  {%- elif name == 'snow' %}<path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/>
  {# money #}
  {%- elif name == 'globe' %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>
  {%- elif name == 'pin' %}<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
  {%- elif name == 'store' %}<path d="M4 9 5.5 4h13L20 9M4 9h16M4 9v11h16V9"/><path d="M10 20v-6h4v6"/>
  {%- elif name == 'wallet' %}<path d="M4 7a2 2 0 0 1 2-2h11v4"/><rect x="4" y="7" width="16" height="13" rx="2.5"/><path d="M16 13.5h.01"/>
  {%- elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
  {%- elif name == 'heart' %}<path d="M12 20s-8-4.7-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 9c0 6.3-8 11-8 11z"/>
  {%- elif name == 'check' %}<path d="m5 12.5 4.5 4.5L19 7"/>
  {%- elif name == 'chevron' %}<path d="m6 9 6 6 6-6"/>
  {%- elif name == 'search' %}<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>
  {%- endif %}
</svg>
{%- endmacro %}
