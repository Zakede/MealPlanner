{% extends "base.html" %}
{% block title %}Rate · Meal Planner{% endblock %}
{% block content %}
<h1>How was it?</h1>
<p class="muted">{{ meal.title }}</p>
<form method="post" class="card">
  <div class="stars" role="radiogroup" aria-label="Stars">
    {% for n in range(1, 6) %}
    <input type="radio" name="stars" value="{{ n }}" id="s{{ n }}"><label for="s{{ n }}" aria-label="{{ n }} star{{ 's' if n > 1 }}">★</label>
    {% endfor %}
  </div>
  <div class="tag-picks">
    {% for t in tags %}
    <input type="checkbox" name="tag_{{ t }}" id="t{{ loop.index }}"><label for="t{{ loop.index }}">{{ t }}</label>
    {% endfor %}
  </div>
  <button class="btn wide">Save</button>
</form>
<a class="btn secondary wide" href="{{ url_for('main.home') }}">Skip</a>
{% endblock %}
