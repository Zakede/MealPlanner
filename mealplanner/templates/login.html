{% extends "base.html" %}
{% block title %}Log in · Zettai{% endblock %}
{% block content %}
<div class="plate" style="margin-top:12vh">
  <form method="post" class="form" style="grid-column: 1 / -1">
    <h1 style="margin:0 0 12px">{{ me.name }}</h1>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button class="btn wide">Open</button>
    <a class="btn secondary wide" href="{{ url_for('people.pick') }}">Not you? Pick someone else or make your own</a>
  </form>
</div>
{% endblock %}
